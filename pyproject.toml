[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kordugum-degil-gordugum"
version = "2.0.0"
description = "İnsanlığı birleştiren sevgi, empati ve anti-ırkçılık felsefesi ve algoritmaları"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Universal-Love & No-Hate License" }
authors = [
  { name = "Gönül Katkıcıları" }
]
keywords = [
  "anti-racism",
  "empathy",
  "unity",
  "nlp",
  "humanity",
  "peace",
  "philosophy"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Sociology",
  "Topic :: Text Processing :: Linguistic"
]

[project.scripts]
gonul = "Logic-of-Unity.gonul_terminali:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Logic-of-Unity*"]
