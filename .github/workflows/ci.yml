name: CI - Gönül Testleri

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu (${{ matrix.python-version }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Birim Testleri Çalıştır
        run: |
          python run_tests.py

      - name: Gönül Terminali CLI Doğrulama
        run: |
          python Logic-of-Unity/gonul_terminali.py --hepsi "yabancılar ve barbarlar burada istenmiyor"
          python Logic-of-Unity/gonul_terminali.py --json --hepsi "birlik ve sevgi"
          python Logic-of-Unity/gonul_terminali.py --hikmet "adalet"
